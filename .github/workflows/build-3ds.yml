# Builds the stereoscopic 3DS version of ScummVM and publishes the
# .cia and .3dsx as a GitHub release, so they can be installed from a phone.
name: Build 3DS

on:
  push:
    branches: [stereo3d]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 3DS libraries and helper tools
        run: |
          # The package servers sometimes fail, so retry with a pause between tries
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "::warning::Attempt $i failed: $*"
              sleep $((i * 15))
            done
            echo "::error::Gave up after 5 attempts: $*"
            return 1
          }
          retry apt-get update
          retry apt-get install -y --no-install-recommends jq unzip curl ca-certificates
          retry dkp-pacman -Sy --needed --noconfirm 3ds-dev 3ds-zlib 3ds-libpng \
            3ds-libjpeg-turbo 3ds-libmad 3ds-libogg 3ds-libvorbisidec 3ds-flac

      - name: Get makerom and bannertool
        id: tools
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/tools" && cd "$HOME/tools"
          apt-get install -y --no-install-recommends git make g++ gcc > /dev/null

          # Prints the first release asset of repo $1 whose name matches $2
          find_asset() {
            code=$(curl -sSL -o releases.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$1/releases?per_page=50")
            if [ "$code" != "200" ]; then echo "::warning::$1 releases: HTTP $code" >> diag.txt; return 1; fi
            echo "::notice::Assets in $1: $(jq -r '[.[].assets[].name] | join(", ")' releases.json | cut -c1-500)" >> diag.txt
            jq -r --arg p "$2" '[.[].assets[] | select(.name | test($p; "i"))][0].browser_download_url // empty' releases.json
          }

          # makerom: prebuilt release, otherwise build from source
          url=$(find_asset 3DSGuy/Project_CTR '^makerom.*(ubuntu|linux)[^a]*\.zip$') || true
          cat diag.txt 2>/dev/null; rm -f diag.txt
          if echo "$url" | grep -q '^https'; then
            curl -fsSL -o makerom.zip "$url" && unzip -o -q makerom.zip -d makerom_files
            cp "$(find makerom_files -type f -name makerom | head -n1)" ./makerom || true
          fi
          if [ ! -s makerom ]; then
            echo "::warning::No prebuilt makerom found, building from source"
            git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git
            (cd Project_CTR/makerom && make deps && make) || echo "::error::makerom source build failed"
            cp "$(find Project_CTR/makerom -type f -name makerom -perm -u+x | head -n1)" ./makerom || true
          fi

          # bannertool: prebuilt release from known repos, otherwise build from source
          for repo in Steveice10/bannertool Epicpkmn11/bannertool diasurgical/bannertool; do
            [ -s bannertool ] && break
            url=$(find_asset "$repo" '^bannertool.*\.zip$') || true
            cat diag.txt 2>/dev/null; rm -f diag.txt
            if echo "$url" | grep -q '^https'; then
              rm -rf bt && curl -fsSL -o bannertool.zip "$url" && unzip -o -q bannertool.zip -d bt
              cp "$(find bt -type f -path '*linux*' -name bannertool | head -n1)" ./bannertool || true
            fi
          done
          if [ ! -s bannertool ]; then
            echo "::warning::No prebuilt bannertool found, building from source"
            for repo in Steveice10/bannertool Epicpkmn11/bannertool diasurgical/bannertool; do
              git clone --depth 1 --recursive "https://github.com/$repo.git" bt_src 2>/dev/null && break
            done
            (cd bt_src && make) || echo "::error::bannertool source build failed"
            cp "$(find bt_src -type f -name bannertool -perm -u+x | head -n1)" ./bannertool || true
          fi

          chmod +x makerom bannertool 2>/dev/null || true
          [ -s makerom ] || { echo "::error::makerom unavailable, CIA will not be built"; exit 1; }
          [ -s bannertool ] || { echo "::error::bannertool unavailable, CIA will not be built"; exit 1; }
          ls -l makerom bannertool

      - name: Configure
        run: |
          export PATH="$DEVKITARM/bin:$PATH"
          export PKG_CONFIG_LIBDIR="$DEVKITPRO/portlibs/3ds/lib/pkgconfig"
          ./configure --host=3ds --disable-all-engines --enable-engine=kyra,lol,eob,scumm,scumm_7_8,he

      - name: Build
        run: |
          export PATH="$DEVKITARM/bin:$PATH"
          make -j"$(nproc)"
          make scummvm.3dsx

      - name: Package CIA
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        run: |
          export PATH="$DEVKITARM/bin:$PATH"
          make scummvm.cia MAKEROM="$HOME/tools/makerom" BANNERTOOL="$HOME/tools/bannertool" \
            || { echo "::error::CIA packaging failed"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="stereo3d-${GITHUB_RUN_NUMBER}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          REL=$(curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" "$API/releases" \
            -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"$GITHUB_SHA\",\"name\":\"Stereo 3DS build $GITHUB_RUN_NUMBER\",\"body\":\"Built from $GITHUB_SHA\"}")
          UPLOAD=$(echo "$REL" | jq -r .upload_url | sed 's/{.*//')
          for f in scummvm.cia scummvm.3dsx; do
            [ -f "$f" ] || { echo "::warning::$f was not built"; continue; }
            curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" "$UPLOAD?name=$f" > /dev/null
          done
